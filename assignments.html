<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignments | CampusAI</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"></head><body class="page-app" data-page="assignments" data-role="student"><div id="toast-container" class="toast-container"></div><div class="app-shell"><aside class="sidebar" id="app-sidebar"></aside><div class="app-main"><header class="topbar"><span class="brand">CampusAI</span><input class="topbar__search" type="search" placeholder="Search assignments" aria-label="Search assignments" data-filter-target="#assignments-body"><div class="topbar__actions"><span class="avatar">AS</span></div></header><main class="page-content"><div class="breadcrumb">Workspace / Assignments</div><section class="page-head"><div><h1>Assignments</h1><p class="page-head__subtitle">Keep track of your coursework and deadlines.</p></div><button class="btn btn--primary" data-modal-open="assignment-modal">＋ Add assignment</button></section><div class="toolbar"><select aria-label="Filter by status"><option>All statuses</option><option>In progress</option><option>Not started</option><option>Submitted</option></select><span class="muted" id="assignment-count">Loading assignments…</span></div><section class="card"><div class="table-wrap"><table id="assignments-table"><thead><tr><th>Assignment</th><th>Subject</th><th>Due date</th><th>Priority</th><th>Status</th></tr></thead><tbody id="assignments-body"></tbody></table></div><p id="assignments-empty" class="empty-state" hidden>No assignments match your search.</p></section><div class="modal" id="assignment-modal" role="dialog" aria-modal="true" hidden><div class="modal__backdrop" data-modal-close></div><form class="modal__dialog" data-demo-form id="assignment-form"><h2>Add an assignment</h2><div class="field"><label for="assignment-name">Title</label><input id="assignment-name" name="title" required></div><div class="field"><label for="assignment-due">Due date</label><input type="date" id="assignment-due" name="due_date" required></div><div class="field"><label for="assignment-subject">Subject</label><input id="assignment-subject" name="subject"></div><div class="field"><label for="assignment-description">Description</label><textarea id="assignment-description" name="description" rows="3"></textarea></div><div class="field"><label for="assignment-priority">Priority</label><select id="assignment-priority" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="modal__actions"><button type="button" class="btn" data-modal-close>Cancel</button><button class="btn btn--primary" id="assignment-save">Save</button></div></form></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>

<script src="assets/js/auth.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/components/utils.js"></script>
<script src="assets/js/components/sidebar.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/dashboard.js"></script></body></html>
