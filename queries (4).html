<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My queries | CampusAI</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dashboard.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"></head><body class="page-app" data-page="queries" data-role="student"><div class="app-shell"><aside class="sidebar" id="app-sidebar"></aside><div class="app-main"><header class="topbar"><span class="brand">CampusAI</span><input type="search" class="topbar__search" placeholder="Search queries" aria-label="Search queries" data-filter-target="#queries-body"><span class="avatar">AS</span></header><main class="page-content"><div class="breadcrumb">Workspace / My queries</div><section class="page-head"><div><h1>My queries</h1><p class="page-head__subtitle">Track questions sent to your faculty.</p></div><button class="btn btn--primary" data-modal-open="query-modal">＋ New query</button></section><section class="card"><div class="table-wrap"><table id="queries-table"><thead><tr><th>Reference</th><th>Title</th><th>Message</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="queries-body"></tbody></table></div></section><div class="modal" id="query-modal" role="dialog" aria-modal="true" hidden><div class="modal__backdrop" data-modal-close></div><form class="modal__dialog" data-demo-form id="query-form"><h2 id="query-modal-title">Submit a query</h2><input type="hidden" id="query-id" name="id"><div class="field"><label for="query-subject">Subject</label><input id="query-subject" name="subject" required></div><div class="field"><label for="query-category">Category</label><select id="query-category" name="category"><option>Academic</option><option>Attendance</option><option>Technical</option></select></div><div class="field"><label for="query-messa
